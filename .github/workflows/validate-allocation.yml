name: validate-allocation

# Pins this catalog's allocation declaration (metamodel-pointer.yaml) against
# the OpenDEAM root model. Drift (wrong layer, stale alias, unknown entity,
# missing discriminator on shared repos) fails CI.
#
# CR-IS-CAT-01 (2026-10-16): pinned to v0.7.0 (post-CR-AR-FMWK-04). The
# legacy v0.2.1 was superseded by the IS Semantic Architecture programme.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  allocation:
    uses: technehub-labs/dea-architecture-framework/.github/workflows/validate-against-model.yml@v0.7.0
    with:
      model_ref: v0.7.0
      pointer_file: metamodel-pointer.yaml
