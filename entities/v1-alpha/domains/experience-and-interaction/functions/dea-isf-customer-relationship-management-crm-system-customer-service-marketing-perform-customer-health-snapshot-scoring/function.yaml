id: dea:information-system-function-customer-relationship-management-crm-system-customer-service-marketing-perform-customer-health-snapshot-scoring
type: InformationSystemFunction
name: Perform customer health snapshot scoring
description: |
  Executes the 'Perform customer health snapshot scoring' function within the Customer Service &
  Marketing sub-system of a Customer Relationship Management (CRM) System. Operating through the
  Segmentation Service and the Survey Component, it processes information, applies the business
  logic and rules defined for Customer Service & Marketing, and contributes to integrated
  enterprise resource, customer, and workforce outcomes with a single source of record. Vendor-
  neutral record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
