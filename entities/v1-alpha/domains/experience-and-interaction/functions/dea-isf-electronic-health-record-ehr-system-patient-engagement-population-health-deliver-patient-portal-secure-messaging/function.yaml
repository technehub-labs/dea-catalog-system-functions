id: dea:information-system-function-electronic-health-record-ehr-system-patient-engagement-population-health-deliver-patient-portal-secure-messaging
type: InformationSystemFunction
name: Deliver patient portal secure messaging
description: |
  Executes the 'Deliver patient portal secure messaging' function within the Patient Engagement
  & Population Health sub-system of a Electronic Health Record (EHR) System. Operating through
  the Portal Service and the Patient Portal Component, it processes information, applies the
  business logic and rules defined for Patient Engagement & Population Health, and contributes
  to safe, coordinated and reimbursable patient care delivery. Vendor-neutral record: vendor
  corroboration (3 distinct vendor systems) is recorded in governance.source_and_evidence; no
  vendor product is canonical (per G-12).
