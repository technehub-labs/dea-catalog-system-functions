id: dea:information-system-function-iot-device-management-platform-device-connectivity-index-and-search-device-fleet
type: InformationSystemFunction
name: Index and search device fleet
description: |
  Executes the 'Index and search device fleet' function within the Device Connectivity sub-
  system of a IoT Device Management Platform. Operating through the Messaging Service and the
  Rules Engine Component, it processes information, applies the business logic and rules defined
  for Device Connectivity, and contributes to synchronized physical flow of goods with end-to-
  end visibility and connected production quality. Vendor-neutral record: vendor corroboration
  (3 distinct vendor systems) is recorded in governance.source_and_evidence; no vendor product
  is canonical (per G-12).
