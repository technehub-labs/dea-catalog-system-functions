id: dea:information-system-function-mobile-core-network-epc-5gc-subscriber-data-management-replicate-subscriber-data-for-resilience
type: InformationSystemFunction
name: Replicate subscriber data for resilience
description: |
  Executes the 'Replicate subscriber data for resilience' function within the Subscriber Data
  Management sub-system of a Mobile Core Network (EPC/5GC). Operating through the Profile
  Service and the Subscriber Repository Component, it processes information, applies the
  business logic and rules defined for Subscriber Data Management, and contributes to revenue-
  accurate service delivery over a high-availability network. Vendor-neutral record: vendor
  corroboration (3 distinct vendor systems) is recorded in governance.source_and_evidence; no
  vendor product is canonical (per G-12).
