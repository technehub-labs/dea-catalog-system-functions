id: dea:information-system-function-data-lakehouse-platform-lakehouse-platform-provision-serverless-notebook-sessions
type: InformationSystemFunction
name: Provision serverless notebook sessions
description: |
  Executes the 'Provision serverless notebook sessions' function within the Lakehouse Platform
  sub-system of a Data Lakehouse Platform. Operating through the Delta Service and the Cluster
  Component, it processes information, applies the business logic and rules defined for
  Lakehouse Platform, and contributes to governed, timely and reliable data products for
  analytics and ML. Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is
  recorded in governance.source_and_evidence; no vendor product is canonical (per G-12).
