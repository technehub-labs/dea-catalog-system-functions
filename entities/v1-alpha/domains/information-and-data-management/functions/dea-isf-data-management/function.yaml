id: dea:information-system-function-data-management
type: InformationSystemFunction
name: Data Management
description: The parent function that composes the data-management sub-tree. It coordinates the acquisition, validation, transformation, persistence, retrieval, retention and disposal of structured data.
version: 1.0.0
lifecycle_status: planned
functional_domain: isf:domain:information-and-data-management
category: isf:domain:information-and-data-management
decomposition_level: F2
child_functions:
- dea:information-system-function-data-acquisition
- dea:information-system-function-data-transformation
- dea:information-system-function-data-retrieval
decomposition_rationale: 'The F2 parent composes the named F4 children below. Each F4 captures an atomic responsibility; the F2 composes them without orchestrating them. The composition follows the CR-IS-CAT-01B
  section 3.3 distinction: the ISC orchestration pattern owns the inter-F4 ordering, retries, and compensation; the F2 exposes the composite.'
responsibility_allocation:
- child: dea:information-system-function-data-acquisition
  responsibility: Realize the information system function data acquisition atomic responsibility.
- child: dea:information-system-function-data-transformation
  responsibility: Realize the information system function data transformation atomic responsibility.
- child: dea:information-system-function-data-retrieval
  responsibility: Realize the information system function data retrieval atomic responsibility.
orchestration_responsibility: Not applicable to this function. The function composes child functions without orchestrating them; orchestration is at the ISC layer, per the composition-vs-orchestration distinction
  in CR-IS-CAT-01B section 3.3.
inputs:
- input_id: data-lifecycle-event
  name: Data lifecycle event
  definition: A business event that triggers a data management flow (e.g., new record creation, schema change, retention trigger).
  data_or_event_reference: dea:event-data-management-invocation
  source: Source systems (via ISC integration).
  required: true
  validation_rules:
  - The data lifecycle event MUST be the single composite input that fires the F2; the F2 delegates per-F4 routing to the F4 children based on the event subtype.
  - All F4 children MUST be registered and reachable.
  - The audit log MUST be available.
  format_or_schema_reference: https://dea.example.org/schemas/data-management-invocation.v1.json
  sensitivity_classification: sensitive
outputs:
- output_id: data-state
  name: Data state
  definition: The state of the data records (acquisition, transformation, retrieval lineage).
  data_or_event_reference: dea:data-entity-data-management-state
  destination: Data store, audit log.
  output_conditions: Always produced (or an error response).
  quality_expectations: Consistent across the F4 children stores.
execution_characteristics:
  execution_pattern: event-driven
  trigger_mechanism: event
  processing_mode: real-time
  synchronous_asynchronous: asynchronous
  idempotency: idempotent
  retry_recovery: Each child function is idempotent; the parent flow is retry-safe.
  error_handling: Each child function emits a structured error; the parent flow records the error and continues with the next step where possible.
  transactional: false
  concurrency: multi-threaded
business_alignment:
  realized_capabilities:
  - capabilities:capability-information-management-6vjgdh
  enabled_processes:
  - dea:process-operate-general-ledger
executing_components:
- dea:information-system-component-data-warehouse-platform
non_functional_characteristics:
  availability: 99.95%
  performance_latency: p99 < 200ms (composed from F4 children)
  throughput: composed from F4 children
  scalability: horizontal
  resilience: active-active
  security: composed from F4 children
  privacy: composed from F4 children
  auditability: full
  recoverability: rto-15m-rpo-5m
  observability: prometheus-metrics
  compliance_constraints: []
governance:
  functional_owner: Information and Data Management team
  steward: Architecture team
  approval_status: proposed
  criticality: mission-critical
  review_date: '2027-10-19'
  lifecycle_history: []
  source_and_evidence: 'Source: ISF taxonomy CR-IS-CAT-01A section 5; P3 population per CR-IS-CAT-01C-P3 (2026-10-19). The decomposition follows the F2 -> F4 pattern with explicit responsibility_allocation
    to the two atomic F4 children. Composition-vs-orchestration distinction: CR-IS-CAT-01B section 3.3.'
  change_history: []
references: []
