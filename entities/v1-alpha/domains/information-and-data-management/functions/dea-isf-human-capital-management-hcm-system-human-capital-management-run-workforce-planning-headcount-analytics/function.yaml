id: dea:information-system-function-human-capital-management-hcm-system-human-capital-management-run-workforce-planning-headcount-analytics
type: InformationSystemFunction
name: Run workforce planning headcount analytics
description: |
  Executes the 'Run workforce planning headcount analytics' function within the Human Capital
  Management sub-system of a Human Capital Management (HCM) System. Operating through the
  Staffing Service and the Business Process Component, it processes information, applies the
  business logic and rules defined for Human Capital Management, and contributes to integrated
  enterprise resource, customer, and workforce outcomes with a single source of record. Vendor-
  neutral record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
