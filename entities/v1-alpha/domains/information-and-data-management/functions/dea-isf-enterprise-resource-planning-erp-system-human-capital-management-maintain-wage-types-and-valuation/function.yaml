id: dea:information-system-function-enterprise-resource-planning-erp-system-human-capital-management-maintain-wage-types-and-valuation
type: InformationSystemFunction
name: Maintain wage types and valuation
description: |
  Executes the 'Maintain wage types and valuation' function within the Human Capital Management
  sub-system of a Enterprise Resource Planning (ERP) System. Operating through the Payroll
  Service and the Wage Type Component, it processes information, applies the business logic and
  rules defined for Human Capital Management, and contributes to integrated enterprise resource,
  customer, and workforce outcomes with a single source of record. Vendor-neutral record: vendor
  corroboration (3 distinct vendor systems) is recorded in governance.source_and_evidence; no
  vendor product is canonical (per G-12).
