  steward: "IS Semantic Architecture programme"
  approval_status: proposed
  criticality: business-critical
  source_and_evidence: 'Primary vendor evidence: Snowflake (Cloud Data Warehouse; identifier SN-CDW-005); corroborated by Google BigQuery (Enterprise Data Warehouse; identifier GCP-CDW-005) and Amazon Redshift (Cloud Data Warehouse; identifier AWS-CDW-005). Corroboration rule: at least 3 distinct vendor systems; evidence only per G-12; no vendor product is canonical.'
