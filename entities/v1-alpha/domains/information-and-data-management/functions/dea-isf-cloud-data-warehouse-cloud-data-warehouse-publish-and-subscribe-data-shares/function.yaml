id: dea:information-system-function-cloud-data-warehouse-cloud-data-warehouse-publish-and-subscribe-data-shares
type: InformationSystemFunction
name: Publish and subscribe data shares
description: |
  Executes the 'Publish and subscribe data shares' function within the Cloud Data Warehouse sub-
  system of a Cloud Data Warehouse. Operating through the Storage Service and the Virtual
  Warehouse Component, it processes information, applies the business logic and rules defined
  for Cloud Data Warehouse, and contributes to governed, timely and reliable data products for
  analytics and ML. Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is
  recorded in governance.source_and_evidence; no vendor product is canonical (per G-12).
version: "1.0.0"
lifecycle_status: planned
functional_domain: isf:domain:information-and-data-management
category: isf:domain:information-and-data-management
decomposition_level: F4
executing_components:
