id: dea:information-system-function-telecom-operations-support-system-oss-network-inventory-topology-maintain-network-resource-inventory
type: InformationSystemFunction
name: Maintain network resource inventory
description: |
  Executes the 'Maintain network resource inventory' function within the Network Inventory &
  Topology sub-system of a Telecom Operations Support System (OSS). Operating through the
  Inventory Service and the Resource Model Component, it processes information, applies the
  business logic and rules defined for Network Inventory & Topology, and contributes to revenue-
  accurate service delivery over a high-availability network. Vendor-neutral record: vendor
  corroboration (3 distinct vendor systems) is recorded in governance.source_and_evidence; no
  vendor product is canonical (per G-12).
