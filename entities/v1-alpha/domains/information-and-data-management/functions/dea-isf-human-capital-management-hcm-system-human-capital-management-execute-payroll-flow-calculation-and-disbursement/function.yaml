id: dea:information-system-function-human-capital-management-hcm-system-human-capital-management-execute-payroll-flow-calculation-and-disbursement
type: InformationSystemFunction
name: Execute payroll flow calculation and disbursement
description: |
  Executes the 'Execute payroll flow calculation and disbursement' function within the Human
  Capital Management sub-system of a Human Capital Management (HCM) System. Operating through
  the Payroll Service and the Performance Component, it processes information, applies the
  business logic and rules defined for Human Capital Management, and contributes to integrated
  enterprise resource, customer, and workforce outcomes with a single source of record. Vendor-
  neutral record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
