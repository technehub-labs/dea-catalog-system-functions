id: dea:information-system-function-telecom-business-support-system-bss-product-offer-catalog-management-manage-product-lifecycle-states-and-versions
type: InformationSystemFunction
name: Manage product lifecycle states and versions
description: |
  Executes the 'Manage product lifecycle states and versions' function within the Product &
  Offer Catalog Management sub-system of a Telecom Business Support System (BSS). Operating
  through the Publication Service and the Catalog Model Component, it processes information,
  applies the business logic and rules defined for Product & Offer Catalog Management, and
  contributes to revenue-accurate service delivery over a high-availability network. Vendor-
  neutral record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
