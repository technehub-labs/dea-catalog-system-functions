id: dea:information-system-function-customer-relationship-management-crm-system-sales-force-automation-qualify-and-convert-lead-to-opportunity
type: InformationSystemFunction
name: Qualify and convert lead to opportunity
description: |
  Executes the 'Qualify and convert lead to opportunity' function within the Sales Force
  Automation sub-system of a Customer Relationship Management (CRM) System. Operating through
  the Opportunity Management Service and the Price Book Component, it processes information,
  applies the business logic and rules defined for Sales Force Automation, and contributes to
  integrated enterprise resource, customer, and workforce outcomes with a single source of
  record. Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
