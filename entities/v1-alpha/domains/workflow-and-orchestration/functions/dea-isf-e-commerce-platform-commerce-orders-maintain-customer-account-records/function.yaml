id: dea:information-system-function-e-commerce-platform-commerce-orders-maintain-customer-account-records
type: InformationSystemFunction
name: Maintain customer account records
description: |
  Executes the 'Maintain customer account records' function within the Commerce & Orders sub-
  system of a E-Commerce Platform. Operating through the Checkout Service and the Catalog
  Component, it processes information, applies the business logic and rules defined for Commerce
  & Orders, and contributes to frictionless omnichannel commerce from catalogue to fulfilment.
  Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
version: "1.0.0"
lifecycle_status: planned
