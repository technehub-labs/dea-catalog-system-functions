  criticality: business-critical
  source_and_evidence: 'Primary vendor evidence: Shopify (Commerce & Orders; identifier SH-CMO-008); corroborated by Adobe Commerce (Order Management; identifier ADB-CMO-008) and BigCommerce (Storefront & Orders; identifier BCG-CMO-008). Corroboration rule: at least 3 distinct vendor systems; evidence only per G-12; no vendor product is canonical.'
