id: dea:information-system-function-telecom-business-support-system-bss-order-management-orchestration-orchestrate-fulfillment-tasks-across-systems
type: InformationSystemFunction
name: Orchestrate fulfillment tasks across systems
description: |
  Executes the 'Orchestrate fulfillment tasks across systems' function within the Order
  Management & Orchestration sub-system of a Telecom Business Support System (BSS). Operating
  through the Milestone Service and the Order Component, it processes information, applies the
  business logic and rules defined for Order Management & Orchestration, and contributes to
  revenue-accurate service delivery over a high-availability network. Vendor-neutral record:
  vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
