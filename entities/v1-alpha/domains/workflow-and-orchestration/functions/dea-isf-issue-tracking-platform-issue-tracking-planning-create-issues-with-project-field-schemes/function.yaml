id: dea:information-system-function-issue-tracking-platform-issue-tracking-planning-create-issues-with-project-field-schemes
type: InformationSystemFunction
name: Create issues with project field schemes
description: |
  Executes the 'Create issues with project field schemes' function within the Issue Tracking &
  Planning sub-system of a Issue Tracking Platform. Operating through the Issue Service and the
  Field Scheme Component, it processes information, applies the business logic and rules defined
  for Issue Tracking & Planning, and contributes to measurable service quality from intake to
  resolution. Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is
  recorded in governance.source_and_evidence; no vendor product is canonical (per G-12).
