id: dea:information-system-function-claims-management-system-claims-intake-adjudication-assign-claim-handler-by-workload-rules
type: InformationSystemFunction
name: Assign claim handler by workload rules
description: |
  Executes the 'Assign claim handler by workload rules' function within the Claims Intake &
  Adjudication sub-system of a Claims Management System. Operating through the Reserve Service
  and the Exposure Component, it processes information, applies the business logic and rules
  defined for Claims Intake & Adjudication, and contributes to safe, compliant and settled
  movement of money, risk and financial messages. Vendor-neutral record: vendor corroboration (3
  distinct vendor systems) is recorded in governance.source_and_evidence; no vendor product is
  canonical (per G-12).
