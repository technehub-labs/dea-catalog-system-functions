id: dea:information-system-function-enterprise-resource-planning-erp-system-project-management-run-project-settlement-to-receivers
type: InformationSystemFunction
name: Run project settlement to receivers
description: |
  Executes the 'Run project settlement to receivers' function within the Project Management sub-
  system of a Enterprise Resource Planning (ERP) System. Operating through the Project Execution
  Service and the WBS Component, it processes information, applies the business logic and rules
  defined for Project Management, and contributes to integrated enterprise resource, customer,
  and workforce outcomes with a single source of record. Vendor-neutral record: vendor
  corroboration (3 distinct vendor systems) is recorded in governance.source_and_evidence; no
  vendor product is canonical (per G-12).
