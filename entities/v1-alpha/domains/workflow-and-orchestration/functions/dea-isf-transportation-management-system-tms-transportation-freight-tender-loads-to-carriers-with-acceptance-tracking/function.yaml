id: dea:information-system-function-transportation-management-system-tms-transportation-freight-tender-loads-to-carriers-with-acceptance-tracking
type: InformationSystemFunction
name: Tender loads to carriers with acceptance tracking
description: |
  Executes the 'Tender loads to carriers with acceptance tracking' function within the
  Transportation & Freight sub-system of a Transportation Management System (TMS). Operating
  through the Tendering Service and the Optimizer Component, it processes information, applies
  the business logic and rules defined for Transportation & Freight, and contributes to
  synchronized physical flow of goods with end-to-end visibility and connected production
  quality. Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is recorded
  in governance.source_and_evidence; no vendor product is canonical (per G-12).
