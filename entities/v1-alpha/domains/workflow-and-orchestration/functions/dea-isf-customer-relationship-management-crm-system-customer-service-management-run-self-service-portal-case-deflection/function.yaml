id: dea:information-system-function-customer-relationship-management-crm-system-customer-service-management-run-self-service-portal-case-deflection
type: InformationSystemFunction
name: Run self-service portal case deflection
description: |
  Executes the 'Run self-service portal case deflection' function within the Customer Service
  Management sub-system of a Customer Relationship Management (CRM) System. Operating through
  the Self-Service Service and the Entitlement Component, it processes information, applies the
  business logic and rules defined for Customer Service Management, and contributes to
  integrated enterprise resource, customer, and workforce outcomes with a single source of
  record. Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
