id: dea:information-system-function-electronic-health-record-ehr-system-clinical-management-schedule-radiology-imaging-orders
type: InformationSystemFunction
name: Schedule radiology imaging orders
description: |
  Executes the 'Schedule radiology imaging orders' function within the Clinical Management sub-
  system of a Electronic Health Record (EHR) System. Operating through the Medication Service
  and the BCMA Component, it processes information, applies the business logic and rules defined
  for Clinical Management, and contributes to safe, coordinated and reimbursable patient care
  delivery. Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is recorded
  in governance.source_and_evidence; no vendor product is canonical (per G-12).
