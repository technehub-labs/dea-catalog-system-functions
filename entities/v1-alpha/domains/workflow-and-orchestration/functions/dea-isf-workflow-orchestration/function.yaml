  - dea:information-system-function-task-routing
responsibility_allocation:
  - child: dea:information-system-function-workflow-execution
    responsibility: "See child function record."
  - child: dea:information-system-function-task-routing
    responsibility: "See child function record."
inputs:
- input_id: workflow-event
  name: "Workflow event"
  definition: "A business event that triggers a workflow (e.g., new order, claim, application)."
  source: "Source systems (via ISC integration)."
  required: true
  sensitivity_classification: sensitive
outputs:
- output_id: workflow-state
  name: "Workflow state"
  definition: "The state of the workflow: initiated, in-progress, suspended, completed, escalated, exception."
  destination: "Workflow store, audit log, downstream systems."
  output_conditions: "Updated on every child function execution."
