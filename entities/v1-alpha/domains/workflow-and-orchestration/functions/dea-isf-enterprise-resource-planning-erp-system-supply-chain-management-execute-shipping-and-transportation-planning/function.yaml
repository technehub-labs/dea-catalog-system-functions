id: dea:information-system-function-enterprise-resource-planning-erp-system-supply-chain-management-execute-shipping-and-transportation-planning
type: InformationSystemFunction
name: Execute shipping and transportation planning
description: |
  Executes the 'Execute shipping and transportation planning' function within the Supply Chain
  Management sub-system of a Enterprise Resource Planning (ERP) System. Operating through the
  Receiving Service and the Lot Genealogy Component, it processes information, applies the
  business logic and rules defined for Supply Chain Management, and contributes to integrated
  enterprise resource, customer, and workforce outcomes with a single source of record. Vendor-
  neutral record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
