id: dea:information-system-function-customer-service-ticketing-platform-customer-service-management-dispatch-csat-surveys-at-resolution
type: InformationSystemFunction
name: Dispatch CSAT surveys at resolution
description: |
  Executes the 'Dispatch CSAT surveys at resolution' function within the Customer Service
  Management sub-system of a Customer Service Ticketing Platform. Operating through the Ticket
  Service and the Trigger Component, it processes information, applies the business logic and
  rules defined for Customer Service Management, and contributes to measurable service quality
  from intake to resolution. Vendor-neutral record: vendor corroboration (3 distinct vendor
  systems) is recorded in governance.source_and_evidence; no vendor product is canonical (per
  G-12).
