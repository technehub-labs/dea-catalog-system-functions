id: dea:information-system-function-manufacturing-execution-system-mes-manufacturing-execution-create-and-release-work-orders-to-floor
type: InformationSystemFunction
name: Create and release work orders to floor
description: |
  Executes the 'Create and release work orders to floor' function within the Manufacturing
  Execution sub-system of a Manufacturing Execution System (MES). Operating through the Order
  Service and the Dispatch Component, it processes information, applies the business logic and
  rules defined for Manufacturing Execution, and contributes to synchronized physical flow of
  goods with end-to-end visibility and connected production quality. Vendor-neutral record:
  vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
