id: dea:information-system-function-it-service-management-itsm-platform-it-service-management-escalate-major-incidents-to-stakeholders
type: InformationSystemFunction
name: Escalate major incidents to stakeholders
description: |
  Executes the 'Escalate major incidents to stakeholders' function within the IT Service
  Management sub-system of a IT Service Management (ITSM) Platform. Operating through the Change
  Service and the CMDB Component, it processes information, applies the business logic and rules
  defined for IT Service Management, and contributes to measurable service quality from intake
  to resolution. Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is
  recorded in governance.source_and_evidence; no vendor product is canonical (per G-12).
