name: Register self-hosted runners to pools
description: |
  Executes the 'Register self-hosted runners to pools' function within the CI/CD Workflows sub-
  system of a Continuous Integration / Continuous Delivery (CI/CD) Platform. Operating through
  the Runner Service and the Matrix Component, it processes information, applies the business
  logic and rules defined for CI/CD Workflows, and contributes to reliable, repeatable and
  observable delivery of software and infrastructure. Vendor-neutral record: vendor
  corroboration (3 distinct vendor systems) is recorded in governance.source_and_evidence; no
  vendor product is canonical (per G-12).
