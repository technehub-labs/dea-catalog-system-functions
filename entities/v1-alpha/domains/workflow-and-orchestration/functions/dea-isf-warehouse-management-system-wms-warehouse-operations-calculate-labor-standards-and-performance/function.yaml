id: dea:information-system-function-warehouse-management-system-wms-warehouse-operations-calculate-labor-standards-and-performance
type: InformationSystemFunction
name: Calculate labor standards and performance
description: |
  Executes the 'Calculate labor standards and performance' function within the Warehouse
  Operations sub-system of a Warehouse Management System (WMS). Operating through the Receiving
  Service and the Task Allocation Component, it processes information, applies the business
  logic and rules defined for Warehouse Operations, and contributes to synchronized physical
  flow of goods with end-to-end visibility and connected production quality. Vendor-neutral
  record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
