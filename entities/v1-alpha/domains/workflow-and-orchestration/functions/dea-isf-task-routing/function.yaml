id: dea:information-system-function-task-routing
type: InformationSystemFunction
name: "Task Routing"
description: |
  The atomic function that routes a task to a queue, a role, an agent, or a human. The routing decision is based on the task type, the routing rules, and the current state of the work pool.
version: "1.0.0"
lifecycle_status: planned
functional_domain: isf:domain:workflow-and-orchestration
category: isf:domain:workflow-and-orchestration
decomposition_level: F4
parent_function: dea:information-system-function-workflow-orchestration
decomposition_rationale: |
  Not applicable to this function. F4 is a leaf; the rationale lives on the
  F2 parent (dea:information-system-function-workflow-orchestration).
inputs:
- input_id: task
  name: "Task"
  definition: "A task to be routed: the task type, the input, the priority."
  source: "Workflow engine or external system."
  required: true
  sensitivity_classification: sensitive
- input_id: routing-rules
  name: "Routing rules"
  definition: "The rules that determine the routing target."
  source: "Routing rule registry."
  required: true
  sensitivity_classification: non-sensitive
outputs:
- output_id: routed-task
  name: "Routed task"
  definition: "A task with a routing target assigned."
  destination: "Work pool, queue, agent inbox."
  output_conditions: "Always produced."
execution_characteristics:
  execution_pattern: synchronous
  trigger_mechanism: api-call
  processing_mode: real-time
  synchronous_asynchronous: synchronous
  idempotency: idempotent
  transactional: false
  concurrency: multi-threaded
business_alignment:
