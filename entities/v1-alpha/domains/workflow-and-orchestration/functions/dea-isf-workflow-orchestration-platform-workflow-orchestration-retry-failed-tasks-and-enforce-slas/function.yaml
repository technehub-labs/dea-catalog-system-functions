id: dea:information-system-function-workflow-orchestration-platform-workflow-orchestration-retry-failed-tasks-and-enforce-slas
type: InformationSystemFunction
name: Retry failed tasks and enforce SLAs
description: |
  Executes the 'Retry failed tasks and enforce SLAs' function within the Workflow Orchestration
  sub-system of a Workflow Orchestration Platform. Operating through the Backfill Service and
  the Executor Component, it processes information, applies the business logic and rules defined
  for Workflow Orchestration, and contributes to governed, timely and reliable data products for
  analytics and ML. Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is
  recorded in governance.source_and_evidence; no vendor product is canonical (per G-12).
