  F2 parent (dea:information-system-function-content-and-knowledge-management).
inputs:
- input_id: query
  name: "Query"
  definition: "The knowledge query (free text or structured expression)."
  source: "Caller."
  required: true
  sensitivity_classification: non-sensitive
- input_id: corpus-scope
  name: "Corpus scope"
  definition: "The corpus scope (which corpora, which tenants, which roles)."
  source: "Policy store."
  required: true
  sensitivity_classification: non-sensitive
outputs:
