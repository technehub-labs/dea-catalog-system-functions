id: dea:information-system-function-content-and-knowledge-management
type: InformationSystemFunction
name: Content and Knowledge Management
description: The parent function that composes the content-and-knowledge-management sub-tree. It governs the storage, retrieval, and lifecycle of unstructured content and knowledge artefacts.
version: 1.0.0
lifecycle_status: planned
functional_domain: isf:domain:content-and-knowledge-management
category: isf:domain:content-and-knowledge-management
decomposition_level: F2
child_functions:
- dea:information-system-function-content-management
- dea:information-system-function-knowledge-retrieval
decomposition_rationale: 'The F2 parent composes the named F4 children below. Each F4 captures an atomic responsibility; the F2 composes them without orchestrating them. The composition follows the CR-IS-CAT-01B
  section 3.3 distinction: the ISC orchestration pattern owns the inter-F4 ordering, retries, and compensation; the F2 exposes the composite.'
responsibility_allocation:
- child: dea:information-system-function-content-management
  responsibility: Realize the information system function content management atomic responsibility.
- child: dea:information-system-function-knowledge-retrieval
  responsibility: Realize the information system function knowledge retrieval atomic responsibility.
orchestration_responsibility: Not applicable to this function. The function composes child functions without orchestrating them; orchestration is at the ISC layer, per the composition-vs-orchestration distinction
  in CR-IS-CAT-01B section 3.3.
inputs:
- input_id: content-lifecycle-event
  name: Content lifecycle event
  definition: A business event that triggers the content storage and retrieval flow.
  data_or_event_reference: dea:event-content-and-knowledge-management-invocation
  source: Caller.
  required: true
  validation_rules:
  - The content lifecycle event MUST be the single composite input that fires the F2; the F2 delegates per-F4 routing to the F4 children based on the event subtype.
  - All F4 children MUST be registered and reachable.
  - The audit log MUST be available.
  format_or_schema_reference: https://dea.example.org/schemas/content-and-knowledge-management-invocation.v1.json
  sensitivity_classification: non-sensitive
outputs:
- output_id: content-lifecycle-state
  name: Content state
  definition: A content lifecycle state composed from the F4 children.
  data_or_event_reference: dea:data-entity-content-and-knowledge-management-state
  destination: Content store, audit log.
  output_conditions: Always produced (or an error response).
  quality_expectations: Consistent across the F4 children stores.
execution_characteristics:
  execution_pattern: event-driven
  trigger_mechanism: event
  processing_mode: real-time
  synchronous_asynchronous: asynchronous
  idempotency: idempotent
  retry_recovery: Each child function is idempotent; the parent flow is retry-safe.
  error_handling: Each child function emits a structured error; the parent flow records the error and continues with the next step where possible.
  transactional: false
  concurrency: multi-threaded
business_alignment:
  realized_capabilities:
  - capabilities:capability-information-management-6vjgdh
  enabled_processes:
  - dea:process-operate-service-delivery
executing_components:
- dea:information-system-component-data-warehouse-platform
- dea:information-system-component-customer-facing-web-application-platform
- dea:information-system-component-data-warehouse-catalog
non_functional_characteristics:
  availability: 99.95%
  performance_latency: p99 < 200ms (composed from F4 children)
  throughput: composed from F4 children
  scalability: horizontal
  resilience: active-active
  security: composed from F4 children
  privacy: composed from F4 children
  auditability: full
  recoverability: rto-15m-rpo-5m
  observability: prometheus-metrics
  compliance_constraints: []
governance:
  functional_owner: Content and Knowledge Management team
  steward: Architecture team
