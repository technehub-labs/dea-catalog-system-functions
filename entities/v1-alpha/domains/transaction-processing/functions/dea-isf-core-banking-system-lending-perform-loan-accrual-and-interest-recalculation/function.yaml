id: dea:information-system-function-core-banking-system-lending-perform-loan-accrual-and-interest-recalculation
type: InformationSystemFunction
name: Perform loan accrual and interest recalculation
description: |
  Executes the 'Perform loan accrual and interest recalculation' function within the Lending
  sub-system of a Core Banking System. Operating through the Collateral Service and the Limit
  Component, it processes information, applies the business logic and rules defined for Lending,
  and contributes to safe, compliant and settled movement of money, risk and financial messages.
  Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
