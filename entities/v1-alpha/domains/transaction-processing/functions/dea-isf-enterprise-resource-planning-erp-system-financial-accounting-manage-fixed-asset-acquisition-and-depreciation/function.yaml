id: dea:information-system-function-enterprise-resource-planning-erp-system-financial-accounting-manage-fixed-asset-acquisition-and-depreciation
type: InformationSystemFunction
name: Manage fixed asset acquisition and depreciation
description: |
  Executes the 'Manage fixed asset acquisition and depreciation' function within the Financial
  Accounting sub-system of a Enterprise Resource Planning (ERP) System. Operating through the
  Collections Service and the Payment Proposal Component, it processes information, applies the
  business logic and rules defined for Financial Accounting, and contributes to integrated
  enterprise resource, customer, and workforce outcomes with a single source of record. Vendor-
  neutral record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
