id: dea:information-system-function-core-banking-system-customer-deposit-accounts-accrue-and-capitalize-interest-to-accounts
type: InformationSystemFunction
name: Accrue and capitalize interest to accounts
description: |
  Executes the 'Accrue and capitalize interest to accounts' function within the Customer &
  Deposit Accounts sub-system of a Core Banking System. Operating through the Account Opening
  Service and the Account Component, it processes information, applies the business logic and
  rules defined for Customer & Deposit Accounts, and contributes to safe, compliant and settled
  movement of money, risk and financial messages. Vendor-neutral record: vendor corroboration (3
  distinct vendor systems) is recorded in governance.source_and_evidence; no vendor product is
  canonical (per G-12).
