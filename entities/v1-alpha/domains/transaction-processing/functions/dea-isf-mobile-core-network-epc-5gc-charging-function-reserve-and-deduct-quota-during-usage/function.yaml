id: dea:information-system-function-mobile-core-network-epc-5gc-charging-function-reserve-and-deduct-quota-during-usage
type: InformationSystemFunction
name: Reserve and deduct quota during usage
description: |
  Executes the 'Reserve and deduct quota during usage' function within the Charging Function
  sub-system of a Mobile Core Network (EPC/5GC). Operating through the Quota Service and the
  Online Charging Component, it processes information, applies the business logic and rules
  defined for Charging Function, and contributes to revenue-accurate service delivery over a
  high-availability network. Vendor-neutral record: vendor corroboration (3 distinct vendor
  systems) is recorded in governance.source_and_evidence; no vendor product is canonical (per
  G-12).
