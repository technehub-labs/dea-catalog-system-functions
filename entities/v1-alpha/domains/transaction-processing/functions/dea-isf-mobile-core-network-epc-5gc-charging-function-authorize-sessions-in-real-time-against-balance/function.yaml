id: dea:information-system-function-mobile-core-network-epc-5gc-charging-function-authorize-sessions-in-real-time-against-balance
type: InformationSystemFunction
name: Authorize sessions in real time against balance
description: |
  Executes the 'Authorize sessions in real time against balance' function within the Charging
  Function sub-system of a Mobile Core Network (EPC/5GC). Operating through the Real-Time
  Authorization Service and the Online Charging Component, it processes information, applies the
  business logic and rules defined for Charging Function, and contributes to revenue-accurate
  service delivery over a high-availability network. Vendor-neutral record: vendor corroboration
  (3 distinct vendor systems) is recorded in governance.source_and_evidence; no vendor product
  is canonical (per G-12).
