id: dea:information-system-function-payment-processing-platform-payments-score-payment-fraud-risk-via-automated-risk-rules
type: InformationSystemFunction
name: Score payment fraud risk via automated risk rules
description: |
  Executes the 'Score payment fraud risk via automated risk rules' function within the Payments
  sub-system of a Payment Processing Platform. Operating through the Card Service and the
  Tokenization Component, it processes information, applies the business logic and rules defined
  for Payments, and contributes to safe, compliant and settled movement of money, risk and
  financial messages. Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is
  recorded in governance.source_and_evidence; no vendor product is canonical (per G-12).
version: "1.0.0"
