id: dea:information-system-function-electronic-health-record-ehr-system-revenue-cycle-assign-coding-and-classification-to-encounters
type: InformationSystemFunction
name: Assign coding and classification to encounters
description: |
  Executes the 'Assign coding and classification to encounters' function within the Revenue
  Cycle sub-system of a Electronic Health Record (EHR) System. Operating through the Claim
  Service and the Claim Scrubbing Component, it processes information, applies the business
  logic and rules defined for Revenue Cycle, and contributes to safe, coordinated and
  reimbursable patient care delivery. Vendor-neutral record: vendor corroboration (3 distinct
  vendor systems) is recorded in governance.source_and_evidence; no vendor product is canonical
  (per G-12).
