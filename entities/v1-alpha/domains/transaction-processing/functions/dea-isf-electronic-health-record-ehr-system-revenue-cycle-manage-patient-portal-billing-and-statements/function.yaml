id: dea:information-system-function-electronic-health-record-ehr-system-revenue-cycle-manage-patient-portal-billing-and-statements
type: InformationSystemFunction
name: Manage patient portal billing and statements
description: |
  Executes the 'Manage patient portal billing and statements' function within the Revenue Cycle
  sub-system of a Electronic Health Record (EHR) System. Operating through the Charge Service
  and the Remittance Component, it processes information, applies the business logic and rules
  defined for Revenue Cycle, and contributes to safe, coordinated and reimbursable patient care
  delivery. Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is recorded
  in governance.source_and_evidence; no vendor product is canonical (per G-12).
