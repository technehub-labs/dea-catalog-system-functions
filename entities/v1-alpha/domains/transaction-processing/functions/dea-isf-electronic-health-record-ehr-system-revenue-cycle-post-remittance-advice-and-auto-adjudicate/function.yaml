id: dea:information-system-function-electronic-health-record-ehr-system-revenue-cycle-post-remittance-advice-and-auto-adjudicate
type: InformationSystemFunction
name: Post remittance advice and auto-adjudicate
description: |
  Executes the 'Post remittance advice and auto-adjudicate' function within the Revenue Cycle
  sub-system of a Electronic Health Record (EHR) System. Operating through the Eligibility
  Service and the Eligibility Component, it processes information, applies the business logic
  and rules defined for Revenue Cycle, and contributes to safe, coordinated and reimbursable
  patient care delivery. Vendor-neutral record: vendor corroboration (3 distinct vendor systems)
  is recorded in governance.source_and_evidence; no vendor product is canonical (per G-12).
