id: dea:information-system-function-core-banking-system-customer-deposit-accounts-execute-end-of-day-batch-processing-eoy-cob
type: InformationSystemFunction
name: Execute end-of-day batch processing (EOY/COB)
description: |
  Executes the 'Execute end-of-day batch processing (EOY/COB)' function within the Customer &
  Deposit Accounts sub-system of a Core Banking System. Operating through the Teller Service and
  the Teller Component, it processes information, applies the business logic and rules defined
  for Customer & Deposit Accounts, and contributes to safe, compliant and settled movement of
  money, risk and financial messages. Vendor-neutral record: vendor corroboration (3 distinct
  vendor systems) is recorded in governance.source_and_evidence; no vendor product is canonical
  (per G-12).
