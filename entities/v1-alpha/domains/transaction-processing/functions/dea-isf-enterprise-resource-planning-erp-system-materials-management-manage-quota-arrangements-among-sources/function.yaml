id: dea:information-system-function-enterprise-resource-planning-erp-system-materials-management-manage-quota-arrangements-among-sources
type: InformationSystemFunction
name: Manage quota arrangements among sources
description: |
  Executes the 'Manage quota arrangements among sources' function within the Materials
  Management sub-system of a Enterprise Resource Planning (ERP) System. Operating through the
  Procurement Service and the Purchase Order Component, it processes information, applies the
  business logic and rules defined for Materials Management, and contributes to integrated
  enterprise resource, customer, and workforce outcomes with a single source of record. Vendor-
  neutral record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
