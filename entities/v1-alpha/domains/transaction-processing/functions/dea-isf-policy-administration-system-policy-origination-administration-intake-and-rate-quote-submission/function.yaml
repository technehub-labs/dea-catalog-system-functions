id: dea:information-system-function-policy-administration-system-policy-origination-administration-intake-and-rate-quote-submission
type: InformationSystemFunction
name: Intake and rate quote submission
description: |
  Executes the 'Intake and rate quote submission' function within the Policy Origination &
  Administration sub-system of a Policy Administration System. Operating through the Quote
  Service and the Rating Component, it processes information, applies the business logic and
  rules defined for Policy Origination & Administration, and contributes to safe, compliant and
  settled movement of money, risk and financial messages. Vendor-neutral record: vendor
  corroboration (3 distinct vendor systems) is recorded in governance.source_and_evidence; no
  vendor product is canonical (per G-12).
