id: dea:information-system-function-telecom-business-support-system-bss-rating-billing-rate-usage-events-against-price-plans
type: InformationSystemFunction
name: Rate usage events against price plans
description: |
  Executes the 'Rate usage events against price plans' function within the Rating & Billing sub-
  system of a Telecom Business Support System (BSS). Operating through the Rating Service and
  the Rating Engine Component, it processes information, applies the business logic and rules
  defined for Rating & Billing, and contributes to revenue-accurate service delivery over a
  high-availability network. Vendor-neutral record: vendor corroboration (3 distinct vendor
  systems) is recorded in governance.source_and_evidence; no vendor product is canonical (per
  G-12).
