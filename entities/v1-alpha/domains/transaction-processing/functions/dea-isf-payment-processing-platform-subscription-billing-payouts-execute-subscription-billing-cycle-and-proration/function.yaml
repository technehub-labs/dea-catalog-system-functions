id: dea:information-system-function-payment-processing-platform-subscription-billing-payouts-execute-subscription-billing-cycle-and-proration
type: InformationSystemFunction
name: Execute subscription billing cycle and proration
description: |
  Executes the 'Execute subscription billing cycle and proration' function within the
  Subscription Billing & Payouts sub-system of a Payment Processing Platform. Operating through
  the Subscription Service and the Billing Cycle Component, it processes information, applies
  the business logic and rules defined for Subscription Billing & Payouts, and contributes to
  safe, compliant and settled movement of money, risk and financial messages. Vendor-neutral
  record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
