id: dea:information-system-function-core-banking-system-trade-finance-treasury-execute-fx-deal-netting-and-settlement
type: InformationSystemFunction
name: Execute FX deal netting and settlement
description: |
  Executes the 'Execute FX deal netting and settlement' function within the Trade Finance &
  Treasury sub-system of a Core Banking System. Operating through the Trade Service and the LC
  Component, it processes information, applies the business logic and rules defined for Trade
  Finance & Treasury, and contributes to safe, compliant and settled movement of money, risk and
  financial messages. Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is
  recorded in governance.source_and_evidence; no vendor product is canonical (per G-12).
