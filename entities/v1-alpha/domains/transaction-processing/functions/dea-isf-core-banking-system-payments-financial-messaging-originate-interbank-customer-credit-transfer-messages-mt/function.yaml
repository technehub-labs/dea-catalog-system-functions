id: dea:information-system-function-core-banking-system-payments-financial-messaging-originate-interbank-customer-credit-transfer-messages-mt
type: InformationSystemFunction
name: Originate interbank customer credit transfer messages (MT)
description: |
  Executes the 'Originate interbank customer credit transfer messages (MT)' function within the
  Payments & Financial Messaging sub-system of a Core Banking System. Operating through the
  Interbank Messaging Service and the SEPA Component, it processes information, applies the
  business logic and rules defined for Payments & Financial Messaging, and contributes to safe,
  compliant and settled movement of money, risk and financial messages. Vendor-neutral record:
  vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
