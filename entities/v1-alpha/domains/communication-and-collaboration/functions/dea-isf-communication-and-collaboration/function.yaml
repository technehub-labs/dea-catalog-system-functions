id: dea:information-system-function-communication-and-collaboration
type: InformationSystemFunction
name: Communication and Collaboration
description: The parent function that composes the communication-and-collaboration sub-tree. It coordinates messaging, presence, and shared workspace access across human and AI agents.
version: 1.0.0
lifecycle_status: planned
functional_domain: isf:domain:communication-and-collaboration
category: isf:domain:communication-and-collaboration
decomposition_level: F2
child_functions:
- dea:information-system-function-collaboration-coordination
- dea:information-system-function-notification-dispatch
decomposition_rationale: 'The F2 parent composes the named F4 children below. Each F4 captures an atomic responsibility; the F2 composes them without orchestrating them. The composition follows the CR-IS-CAT-01B
  section 3.3 distinction: the ISC orchestration pattern owns the inter-F4 ordering, retries, and compensation; the F2 exposes the composite.'
responsibility_allocation:
- child: dea:information-system-function-collaboration-coordination
  responsibility: Realize the information system function collaboration coordination atomic responsibility.
- child: dea:information-system-function-notification-dispatch
  responsibility: Realize the information system function notification dispatch atomic responsibility.
orchestration_responsibility: Not applicable to this function. The function composes child functions without orchestrating them; orchestration is at the ISC layer, per the composition-vs-orchestration distinction
  in CR-IS-CAT-01B section 3.3.
inputs:
- input_id: collaboration-and-collaboration-event
