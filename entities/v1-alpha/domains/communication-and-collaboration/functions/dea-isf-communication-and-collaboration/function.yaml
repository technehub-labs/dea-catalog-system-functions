  data_or_event_reference: dea:event-communication-and-collaboration-invocation
  source: Caller.
  required: true
  validation_rules:
  - The collaboration event MUST be the single composite input that fires the F2; the F2 delegates per-F4 routing to the F4 children based on the event subtype.
  - All F4 children MUST be registered and reachable.
  - The audit log MUST be available.
  format_or_schema_reference: https://dea.example.org/schemas/communication-and-collaboration-invocation.v1.json
  sensitivity_classification: non-sensitive
outputs:
