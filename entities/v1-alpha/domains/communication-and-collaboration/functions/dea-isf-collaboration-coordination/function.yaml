id: dea:information-system-function-collaboration-coordination
type: InformationSystemFunction
name: "Collaboration Coordination"
description: |
  The atomic function that routes work, messages, and presence between collaborating agents and humans. It applies routing rules and produces a coordination record.
version: "1.0.0"
lifecycle_status: planned
functional_domain: isf:domain:communication-and-collaboration
category: isf:domain:communication-and-collaboration
decomposition_level: F4
parent_function: dea:information-system-function-communication-and-collaboration
decomposition_rationale: |
  Not applicable to this function. F4 is a leaf; the rationale lives on the
  F2 parent (dea:information-system-function-communication-and-collaboration).
inputs:
- input_id: coordination-request
  name: "Coordination request"
  definition: "A coordination request: target agent or work item and the coordination action (route, ping, hand-off)."
  source: "Caller."
  required: true
  sensitivity_classification: non-sensitive
- input_id: routing-rule
  name: "Routing rule"
  definition: "The rule that determines the recipient channel and policy for this coordination action."
  source: "Policy store."
  required: true
  sensitivity_classification: non-sensitive
outputs:
- output_id: coordination-record
  name: "Coordination record"
  definition: "A coordination record (recipient, action, status, evidence)."
  destination: "Coordination store, audit log."
  output_conditions: "Always produced (or an error response)."
execution_characteristics:
  execution_pattern: synchronous
  trigger_mechanism: api-call
  processing_mode: real-time
  synchronous_asynchronous: synchronous
  idempotency: idempotent
  transactional: true
  concurrency: multi-threaded
business_alignment:
  realized_capabilities:
    - capabilities:capability-workforce-management-9e8d8s
  enabled_processes:
    - dea:process-coordinate-collaboration
executing_components:
  - dea:information-system-component-employee-portal-platform
  - dea:information-system-component-api-gateway
non_functional_characteristics:
  criticality: mission-critical
governance:
