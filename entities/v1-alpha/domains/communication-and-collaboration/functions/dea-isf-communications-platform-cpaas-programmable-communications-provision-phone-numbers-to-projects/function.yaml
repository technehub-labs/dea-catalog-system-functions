id: dea:information-system-function-communications-platform-cpaas-programmable-communications-provision-phone-numbers-to-projects
type: InformationSystemFunction
name: Provision phone numbers to projects
description: |
  Executes the 'Provision phone numbers to projects' function within the Programmable
  Communications sub-system of a Communications Platform (CPaaS). Operating through the
  Messaging Service and the SMS Component, it processes information, applies the business logic
  and rules defined for Programmable Communications, and contributes to dependable customer
  communications at scale. Vendor-neutral record: vendor corroboration (3 distinct vendor
  systems) is recorded in governance.source_and_evidence; no vendor product is canonical (per
  G-12).
