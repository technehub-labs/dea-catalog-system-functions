id: dea:information-system-function-notification-dispatch
type: InformationSystemFunction
name: "Notification Dispatch"
description: |
  The atomic function that delivers a notification (transactional, scheduled, or event-driven) to a recipient across the appropriate channel.
version: "1.0.0"
lifecycle_status: planned
functional_domain: isf:domain:communication-and-collaboration
category: isf:domain:communication-and-collaboration
decomposition_level: F4
parent_function: dea:information-system-function-communication-and-collaboration
decomposition_rationale: |
  Not applicable to this function. F4 is a leaf; the rationale lives on the
  F2 parent (dea:information-system-function-communication-and-collaboration).
inputs:
- input_id: notification-payload
  name: "Notification payload"
  definition: "The notification payload (subject, body, recipient, channel)."
  source: "Caller."
  required: true
  sensitivity_classification: sensitive
- input_id: recipient-policy
  name: "Recipient policy"
  definition: "The recipient routing and preference policy."
  source: "Policy store."
  required: true
  sensitivity_classification: non-sensitive
outputs:
- output_id: delivered-notification
  name: "Delivered notification"
  definition: "A delivered-notification record with the channel, timestamp, and delivery evidence."
  destination: "Notification store, audit log."
  output_conditions: "Always produced (or an error response)."
execution_characteristics:
  execution_pattern: synchronous
  trigger_mechanism: api-call
  processing_mode: real-time
  synchronous_asynchronous: synchronous
