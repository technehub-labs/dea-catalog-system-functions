id: dea:information-system-function-email-delivery-platform-email-delivery-manage-suppression-and-unsubscribe-lists
type: InformationSystemFunction
name: Manage suppression and unsubscribe lists
description: |
  Executes the 'Manage suppression and unsubscribe lists' function within the Email Delivery
  sub-system of a Email Delivery Platform. Operating through the Event Service and the Template
  Component, it processes information, applies the business logic and rules defined for Email
  Delivery, and contributes to dependable customer communications at scale. Vendor-neutral
  record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
