  criticality: business-critical
  source_and_evidence: 'Primary vendor evidence: Ericsson OSS & Network Management (Performance Management; identifier ERO-PM-002); corroborated by Nokia (Performance Management (NetAct); identifier NOK-PM-002) and Huawei (iManager M2000; identifier HWE-PM-002). Corroboration rule: at least 3 distinct vendor systems; evidence only per G-12; no vendor product is canonical.'
