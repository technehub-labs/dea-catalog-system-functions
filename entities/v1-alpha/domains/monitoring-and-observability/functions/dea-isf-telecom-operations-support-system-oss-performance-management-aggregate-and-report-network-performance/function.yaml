id: dea:information-system-function-telecom-operations-support-system-oss-performance-management-aggregate-and-report-network-performance
type: InformationSystemFunction
name: Aggregate and report network performance
description: |
  Executes the 'Aggregate and report network performance' function within the Performance
  Management sub-system of a Telecom Operations Support System (OSS). Operating through the
  Aggregation Service and the Counter Component, it processes information, applies the business
  logic and rules defined for Performance Management, and contributes to revenue-accurate
  service delivery over a high-availability network. Vendor-neutral record: vendor corroboration
  (3 distinct vendor systems) is recorded in governance.source_and_evidence; no vendor product
  is canonical (per G-12).
version: "1.0.0"
