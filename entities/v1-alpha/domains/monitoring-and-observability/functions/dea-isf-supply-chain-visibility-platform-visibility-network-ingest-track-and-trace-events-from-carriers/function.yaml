id: dea:information-system-function-supply-chain-visibility-platform-visibility-network-ingest-track-and-trace-events-from-carriers
type: InformationSystemFunction
name: Ingest track-and-trace events from carriers
description: |
  Executes the 'Ingest track-and-trace events from carriers' function within the Visibility
  Network sub-system of a Supply Chain Visibility Platform. Operating through the Tracking
  Service and the Milestone Component, it processes information, applies the business logic and
  rules defined for Visibility Network, and contributes to synchronized physical flow of goods
  with end-to-end visibility and connected production quality. Vendor-neutral record: vendor
  corroboration (3 distinct vendor systems) is recorded in governance.source_and_evidence; no
  vendor product is canonical (per G-12).
