id: dea:information-system-function-telecom-operations-support-system-oss-fault-management-service-assurance-dispatch-field-teams-for-network-repairs
type: InformationSystemFunction
name: Dispatch field teams for network repairs
description: |
  Executes the 'Dispatch field teams for network repairs' function within the Fault Management &
  Service Assurance sub-system of a Telecom Operations Support System (OSS). Operating through
  the Dispatch Service and the Event Correlation Component, it processes information, applies
  the business logic and rules defined for Fault Management & Service Assurance, and contributes
  to revenue-accurate service delivery over a high-availability network. Vendor-neutral record:
  vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
