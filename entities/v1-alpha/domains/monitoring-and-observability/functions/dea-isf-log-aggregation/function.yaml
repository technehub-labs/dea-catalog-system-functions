id: dea:information-system-function-log-aggregation
type: InformationSystemFunction
name: "Log Aggregation"
description: |
  The atomic function that ingests a log record, indexes it for retrieval, and emits the log-indexed event.
version: "1.0.0"
lifecycle_status: planned
functional_domain: isf:domain:monitoring-and-observability
category: isf:domain:monitoring-and-observability
decomposition_level: F4
parent_function: dea:information-system-function-monitoring-and-observability
decomposition_rationale: |
  Not applicable to this function. F4 is a leaf; the rationale lives on the
  F2 parent (dea:information-system-function-monitoring-and-observability).
inputs:
- input_id: log-record
  name: "Log record"
  definition: "A log record ingested from a runtime source."
  source: "Runtime instrumentation."
  required: true
  sensitivity_classification: sensitive
- input_id: index-rule
  name: "Index rule"
  definition: "The retention, indexing, and redaction rule."
  source: "Policy store."
  required: true
  sensitivity_classification: non-sensitive
outputs:
- output_id: indexed-log
  name: "Indexed log"
  definition: "An indexed-log record ready for retrieval."
  destination: "Log store, audit log."
  output_conditions: "Always produced (or an error response)."
