id: dea:information-system-function-insight-generation
type: InformationSystemFunction
name: "Insight Generation"
description: |
  The atomic function that produces an insight (forecast, anomaly, recommendation) from analytical outputs and emits the insight-ready event.
version: "1.0.0"
lifecycle_status: planned
functional_domain: isf:domain:analytics-and-decision-support
category: isf:domain:analytics-and-decision-support
decomposition_level: F4
parent_function: dea:information-system-function-analytics-and-decision-support
decomposition_rationale: |
  Not applicable to this function. F4 is a leaf; the rationale lives on the
  F2 parent (dea:information-system-function-analytics-and-decision-support).
inputs:
- input_id: analytical-output
  name: "Analytical output"
  definition: "An analytical output produced by the data-analysis function."
  source: "Data analysis store."
  required: true
  sensitivity_classification: sensitive
- input_id: insight-model
  name: "Insight model"
  definition: "The model or rule that produces an insight from the analytical output."
  source: "Model store."
  required: true
  sensitivity_classification: non-sensitive
outputs:
- output_id: insight-record
  name: "Insight record"
  definition: "An insight record (insight type, value, confidence, provenance)."
  destination: "Insight store."
  output_conditions: "Always produced (or an error response)."
