  responsibility: The Data Analysis child function is responsible for its atomic role within the Analytics And Decision Support domain.
- child: dea:information-system-function-insight-generation
  responsibility: The Insight Generation child function is responsible for its atomic role within the Analytics And Decision Support domain.
orchestration_responsibility: Not applicable to this function. The function composes child functions without orchestrating them; orchestration is at the ISC layer.
