id: dea:information-system-function-analytics-and-decision-support
type: InformationSystemFunction
name: Analytics and Decision Support
description: The parent function that composes the analytics-and-decision-support sub-tree. It transforms operational data into analytical outputs and decision signals.
version: 1.0.0
lifecycle_status: planned
functional_domain: isf:domain:analytics-and-decision-support
category: isf:domain:analytics-and-decision-support
decomposition_level: F2
child_functions:
- dea:information-system-function-data-analysis
- dea:information-system-function-insight-generation
decomposition_rationale: 'The F2 parent composes the named F4 children below. Each F4 captures an atomic responsibility; the F2 composes them without orchestrating them. The composition follows the CR-IS-CAT-01B
  section 3.3 distinction: the ISC orchestration pattern owns the inter-F4 ordering, retries, and compensation; the F2 exposes the composite.'
responsibility_allocation:
- child: dea:information-system-function-data-analysis
  responsibility: Realize the information system function data analysis atomic responsibility.
- child: dea:information-system-function-insight-generation
  responsibility: Realize the information system function insight generation atomic responsibility.
orchestration_responsibility: Not applicable to this function. The function composes child functions without orchestrating them; orchestration is at the ISC layer, per the composition-vs-orchestration distinction
  in CR-IS-CAT-01B section 3.3.
inputs:
- input_id: analytical-subject-area-event
  name: Analytical event
  definition: A business event that triggers the analytics transformation and insight generation flow.
  data_or_event_reference: dea:event-analytics-and-decision-support-invocation
  source: Caller.
  required: true
  validation_rules:
  - The analytical event MUST be the single composite input that fires the F2; the F2 delegates per-F4 routing to the F4 children based on the event subtype.
  - All F4 children MUST be registered and reachable.
  - The audit log MUST be available.
  format_or_schema_reference: https://dea.example.org/schemas/analytics-and-decision-support-invocation.v1.json
  sensitivity_classification: non-sensitive
outputs:
- output_id: analytical-output-state
  name: Analytical state
  definition: An analytical output state composed from the F4 children.
  data_or_event_reference: dea:data-entity-analytics-and-decision-support-state
  destination: Insight store, audit log.
  output_conditions: Always produced (or an error response).
  quality_expectations: Consistent across the F4 children stores.
execution_characteristics:
  execution_pattern: event-driven
  trigger_mechanism: event
  processing_mode: real-time
  synchronous_asynchronous: asynchronous
  idempotency: idempotent
  retry_recovery: Each child function is idempotent; the parent flow is retry-safe.
  error_handling: Each child function emits a structured error; the parent flow records the error and continues with the next step where possible.
  transactional: false
  concurrency: multi-threaded
business_alignment:
  realized_capabilities:
  - capabilities:capability-insight-management-ms4n9d
  enabled_processes:
  - dea:process-operate-financial-reporting-and-disclosure
  - dea:process-customer-insight-and-retention
executing_components:
- dea:information-system-component-data-warehouse-platform
- dea:information-system-component-data-warehouse-query
- dea:information-system-component-ai-inference-platform
non_functional_characteristics:
  availability: 99.95%
  performance_latency: p99 < 200ms (composed from F4 children)
  throughput: composed from F4 children
  scalability: horizontal
  resilience: active-active
  security: composed from F4 children
  privacy: composed from F4 children
  auditability: full
  recoverability: rto-15m-rpo-5m
  observability: prometheus-metrics
  compliance_constraints: []
governance:
  functional_owner: Analytics and Decision Support team
  steward: Architecture team
  approval_status: proposed
  criticality: mission-critical
  review_date: '2027-10-19'
  lifecycle_history: []
  source_and_evidence: 'Source: ISF taxonomy CR-IS-CAT-01A section 5; P2 population per CR-IS-CAT-01C-P2 (2026-10-19). The decomposition follows the F2 -> F4 pattern with explicit responsibility_allocation
    to the two atomic F4 children. Composition-vs-orchestration distinction: CR-IS-CAT-01B section 3.3.'
  change_history: []
references: []
