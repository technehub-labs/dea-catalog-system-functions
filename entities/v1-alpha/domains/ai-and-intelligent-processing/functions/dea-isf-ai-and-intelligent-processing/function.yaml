id: dea:information-system-function-ai-and-intelligent-processing
type: InformationSystemFunction
name: AI and Intelligent Processing
description: The parent function that composes the ai-and-intelligent-processing sub-tree. It manages model lifecycles and executes inferences for predictions and decisions.
version: 1.0.0
lifecycle_status: planned
functional_domain: isf:domain:ai-and-intelligent-processing
category: isf:domain:ai-and-intelligent-processing
decomposition_level: F2
child_functions:
- dea:information-system-function-model-management
- dea:information-system-function-inference-execution
decomposition_rationale: 'The F2 parent composes the named F4 children below. Each F4 captures an atomic responsibility; the F2 composes them without orchestrating them. The composition follows the CR-IS-CAT-01B
  section 3.3 distinction: the ISC orchestration pattern owns the inter-F4 ordering, retries, and compensation; the F2 exposes the composite.'
responsibility_allocation:
- child: dea:information-system-function-model-management
  responsibility: Realize the information system function model management atomic responsibility.
- child: dea:information-system-function-inference-execution
  responsibility: Realize the information system function inference execution atomic responsibility.
orchestration_responsibility: Not applicable to this function. The function composes child functions without orchestrating them; orchestration is at the ISC layer, per the composition-vs-orchestration distinction
  in CR-IS-CAT-01B section 3.3.
inputs:
- input_id: ai-and-intelligence-event
  name: AI event
  definition: A business event that triggers the model-management or inference-execution flow.
  data_or_event_reference: dea:event-ai-and-intelligent-processing-invocation
  source: Caller.
  required: true
  validation_rules:
  - The ai event MUST be the single composite input that fires the F2; the F2 delegates per-F4 routing to the F4 children based on the event subtype.
  - All F4 children MUST be registered and reachable.
  - The audit log MUST be available.
  format_or_schema_reference: https://dea.example.org/schemas/ai-and-intelligent-processing-invocation.v1.json
  sensitivity_classification: non-sensitive
outputs:
- output_id: inference-state
  name: Inference state
  definition: An inference state composed from the F4 children (model version, prediction confidence).
  data_or_event_reference: dea:data-entity-ai-and-intelligent-processing-state
  destination: Model store, audit log.
  output_conditions: Always produced (or an error response).
  quality_expectations: Consistent across the F4 children stores.
execution_characteristics:
  execution_pattern: event-driven
  trigger_mechanism: event
  processing_mode: real-time
  synchronous_asynchronous: asynchronous
  idempotency: idempotent
  retry_recovery: Each child function is idempotent; the parent flow is retry-safe.
  error_handling: Each child function emits a structured error; the parent flow records the error and continues with the next step where possible.
  transactional: false
  concurrency: multi-threaded
business_alignment:
  realized_capabilities:
  - capabilities:capability-insight-management-ms4n9d
  enabled_processes:
  - dea:process-improve-technology-platforms
  - dea:process-customer-insight-and-retention
executing_components:
- dea:information-system-component-ai-inference-platform
- dea:information-system-component-model-registry
- dea:information-system-component-model-serving-runtime
non_functional_characteristics:
  availability: 99.95%
  performance_latency: p99 < 200ms (composed from F4 children)
  throughput: composed from F4 children
  scalability: horizontal
  resilience: active-active
  security: composed from F4 children
  privacy: composed from F4 children
  auditability: full
  recoverability: rto-15m-rpo-5m
  observability: prometheus-metrics
  compliance_constraints: []
governance:
  functional_owner: AI and Intelligent Processing team
  steward: Architecture team
  approval_status: proposed
  criticality: mission-critical
