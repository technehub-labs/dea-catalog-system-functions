id: dea:information-system-function-event-publication
type: InformationSystemFunction
name: "Event Publication"
description: |
  The atomic function that publishes a domain event to the event bus. The publication is at-least-once with ordering guarantees per partition key.
version: "1.0.0"
lifecycle_status: planned
functional_domain: isf:domain:integration-and-interoperability
category: isf:domain:integration-and-interoperability
