  F2 parent (dea:information-system-function-integration-and-interoperability).
inputs:
- input_id: domain-event
  name: "Domain event"
  definition: "A domain event: the event type, the event payload, the partition key, the metadata."
  source: "Source system."
  required: true
  sensitivity_classification: sensitive
outputs:
- output_id: publication-result
  name: "Publication result"
  definition: "The publication result: the event ID, the offset, the partition, the publication timestamp."
  destination: "Event store, audit log."
  output_conditions: "Always produced (or an error response)."
