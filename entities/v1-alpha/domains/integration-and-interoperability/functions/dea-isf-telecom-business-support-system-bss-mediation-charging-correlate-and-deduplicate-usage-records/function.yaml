id: dea:information-system-function-telecom-business-support-system-bss-mediation-charging-correlate-and-deduplicate-usage-records
type: InformationSystemFunction
name: Correlate and deduplicate usage records
description: |
  Executes the 'Correlate and deduplicate usage records' function within the Mediation &
  Charging sub-system of a Telecom Business Support System (BSS). Operating through the
  Correlation Service and the Mediation Component, it processes information, applies the
  business logic and rules defined for Mediation & Charging, and contributes to revenue-accurate
  service delivery over a high-availability network. Vendor-neutral record: vendor corroboration
  (3 distinct vendor systems) is recorded in governance.source_and_evidence; no vendor product
  is canonical (per G-12).
