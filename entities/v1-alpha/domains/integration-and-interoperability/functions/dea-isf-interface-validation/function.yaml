id: dea:information-system-function-interface-validation
type: InformationSystemFunction
name: "Interface Validation"
description: |
  The atomic function that validates an interface contract: schema conformance, semantic conformance, and contract version. Returns accepted, rejected, or warning.
version: "1.0.0"
lifecycle_status: planned
functional_domain: isf:domain:integration-and-interoperability
category: isf:domain:integration-and-interoperability
decomposition_level: F4
parent_function: dea:information-system-function-integration-and-interoperability
decomposition_rationale: |
  Not applicable to this function. F4 is a leaf; the rationale lives on the
  F2 parent (dea:information-system-function-integration-and-interoperability).
inputs:
- input_id: interface-payload
  name: "Interface payload"
  definition: "A payload to be validated against an interface contract."
  source: "Caller."
  required: true
  sensitivity_classification: sensitive
- input_id: interface-contract
  name: "Interface contract"
  definition: "The contract: schema, semantic rules, version."
  source: "Contract registry."
  required: true
  sensitivity_classification: non-sensitive
outputs:
- output_id: validation-result
  name: "Validation result"
  definition: "The validation result: accepted, rejected (with reason), or warning (with reason)."
  destination: "Caller, audit log."
  output_conditions: "Always produced."
