id: dea:information-system-function-e-commerce-platform-composable-commerce-api-publish-product-projections-to-channels
type: InformationSystemFunction
name: Publish product projections to channels
description: |
  Executes the 'Publish product projections to channels' function within the Composable Commerce
  API sub-system of a E-Commerce Platform. Operating through the Product Service and the
  Projection Component, it processes information, applies the business logic and rules defined
  for Composable Commerce API, and contributes to frictionless omnichannel commerce from
  catalogue to fulfilment. Vendor-neutral record: vendor corroboration (3 distinct vendor
  systems) is recorded in governance.source_and_evidence; no vendor product is canonical (per
  G-12).
