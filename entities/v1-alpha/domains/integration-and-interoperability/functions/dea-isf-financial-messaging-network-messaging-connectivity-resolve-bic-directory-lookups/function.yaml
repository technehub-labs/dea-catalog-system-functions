id: dea:information-system-function-financial-messaging-network-messaging-connectivity-resolve-bic-directory-lookups
type: InformationSystemFunction
name: Resolve BIC directory lookups
description: |
  Executes the 'Resolve BIC directory lookups' function within the Messaging & Connectivity sub-
  system of a Financial Messaging Network. Operating through the Validation Service and the
  Standards Component, it processes information, applies the business logic and rules defined
  for Messaging & Connectivity, and contributes to safe, compliant and settled movement of
  money, risk and financial messages. Vendor-neutral record: vendor corroboration (3 distinct
  vendor systems) is recorded in governance.source_and_evidence; no vendor product is canonical
  (per G-12).
