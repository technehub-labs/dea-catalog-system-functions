id: dea:information-system-function-event-streaming-platform-event-streaming-platform-commit-exactly-once-transactional-state
type: InformationSystemFunction
name: Commit exactly-once transactional state
description: |
  Executes the 'Commit exactly-once transactional state' function within the Event Streaming
  Platform sub-system of a Event Streaming Platform. Operating through the Broker Service and
  the Partition Component, it processes information, applies the business logic and rules
  defined for Event Streaming Platform, and contributes to governed, timely and reliable data
  products for analytics and ML. Vendor-neutral record: vendor corroboration (3 distinct vendor
  systems) is recorded in governance.source_and_evidence; no vendor product is canonical (per
  G-12).
