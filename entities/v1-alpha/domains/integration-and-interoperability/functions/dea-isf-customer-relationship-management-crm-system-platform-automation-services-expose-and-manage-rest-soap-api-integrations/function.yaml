id: dea:information-system-function-customer-relationship-management-crm-system-platform-automation-services-expose-and-manage-rest-soap-api-integrations
type: InformationSystemFunction
name: Expose and manage REST/SOAP API integrations
description: |
  Executes the 'Expose and manage REST/SOAP API integrations' function within the Platform
  Automation Services sub-system of a Customer Relationship Management (CRM) System. Operating
  through the Deployment Service and the API Component, it processes information, applies the
  business logic and rules defined for Platform Automation Services, and contributes to
  integrated enterprise resource, customer, and workforce outcomes with a single source of
  record. Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
