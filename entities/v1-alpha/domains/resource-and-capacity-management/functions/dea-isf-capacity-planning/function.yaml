id: dea:information-system-function-capacity-planning
type: InformationSystemFunction
name: "Capacity Planning"
description: |
  The atomic function that consumes historical and forecast demand signals and produces a capacity plan (compute, storage, integration) over a planning horizon.
version: "1.0.0"
lifecycle_status: planned
functional_domain: isf:domain:resource-and-capacity-management
category: isf:domain:resource-and-capacity-management
decomposition_level: F4
parent_function: dea:information-system-function-resource-and-capacity-management
decomposition_rationale: |
  Not applicable to this function. F4 is a leaf; the rationale lives on the
  F2 parent (dea:information-system-function-resource-and-capacity-management).
inputs:
- input_id: capacity-demand-signal
  name: "Capacity demand signal"
  definition: "A demand signal (historical workload or forecast) for a capacity dimension (compute, storage, integration)."
  source: "Observability, planning store."
  required: true
  sensitivity_classification: non-sensitive
- input_id: capacity-policy
  name: "Capacity policy"
  definition: "The capacity-planning policy (thresholds, growth factor, headroom)."
  source: "Policy store."
  required: true
  sensitivity_classification: non-sensitive
outputs:
- output_id: capacity-plan
  name: "Capacity plan"
  definition: "A capacity plan over the planning horizon (compute, storage, integration)."
  destination: "Capacity store, audit log."
  output_conditions: "Always produced (or an error response)."
execution_characteristics:
  execution_pattern: synchronous
  trigger_mechanism: api-call
  processing_mode: real-time
  synchronous_asynchronous: synchronous
  idempotency: idempotent
  transactional: true
  concurrency: multi-threaded
business_alignment:
  realized_capabilities:
    - capabilities:capability-technology-management-maus5n
  enabled_processes:
    - dea:process-improve-technology-platforms
executing_components:
  - dea:information-system-component-observability-platform
  - dea:information-system-component-development-platform
non_functional_characteristics:
  criticality: mission-critical
governance:
  functional_owner: "Architecture team"
  steward: "Architecture team"
  approval_status: proposed
  criticality: mission-critical
  review_date: "2027-10-18"
references:
