id: dea:information-system-function-radio-access-network-ran-cell-radio-resource-management-schedule-radio-resources-across-users
type: InformationSystemFunction
name: Schedule radio resources across users
description: |
  Executes the 'Schedule radio resources across users' function within the Cell & Radio Resource
  Management sub-system of a Radio Access Network (RAN). Operating through the Scheduler Service
  and the Radio Resource Component, it processes information, applies the business logic and
  rules defined for Cell & Radio Resource Management, and contributes to revenue-accurate
  service delivery over a high-availability network. Vendor-neutral record: vendor corroboration
  (3 distinct vendor systems) is recorded in governance.source_and_evidence; no vendor product
  is canonical (per G-12).
