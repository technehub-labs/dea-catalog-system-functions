id: dea:information-system-function-mobile-core-network-epc-5gc-mobility-session-management-maintain-bearer-and-pdu-session-continuity
type: InformationSystemFunction
name: Maintain bearer and PDU session continuity
description: |
  Executes the 'Maintain bearer and PDU session continuity' function within the Mobility &
  Session Management sub-system of a Mobile Core Network (EPC/5GC). Operating through the
  Handover Service and the Access & Mobility Component, it processes information, applies the
  business logic and rules defined for Mobility & Session Management, and contributes to
  revenue-accurate service delivery over a high-availability network. Vendor-neutral record:
  vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
