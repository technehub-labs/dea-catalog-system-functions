id: dea:information-system-function-cloud-infrastructure-platform-compute-storage-networking-services-distribute-messages-via-managed-message-queues
type: InformationSystemFunction
name: Distribute messages via managed message queues
description: |
  Executes the 'Distribute messages via managed message queues' function within the Compute,
  Storage & Networking Services sub-system of a Cloud Infrastructure Platform. Operating through
  the Messaging Service and the Lifecycle Component, it processes information, applies the
  business logic and rules defined for Compute, Storage & Networking Services, and contributes
  to reliable, repeatable and observable delivery of software and infrastructure. Vendor-neutral
  record: vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
