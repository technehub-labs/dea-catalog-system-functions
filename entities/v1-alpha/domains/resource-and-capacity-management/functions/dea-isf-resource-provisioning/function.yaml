id: dea:information-system-function-resource-provisioning
type: InformationSystemFunction
name: "Resource Provisioning"
description: |
  The atomic function that allocates and provisions a resource (compute, storage, integration slot) per the capacity plan and emits the resource-provisioned event.
version: "1.0.0"
lifecycle_status: planned
functional_domain: isf:domain:resource-and-capacity-management
category: isf:domain:resource-and-capacity-management
decomposition_level: F4
parent_function: dea:information-system-function-resource-and-capacity-management
decomposition_rationale: |
  Not applicable to this function. F4 is a leaf; the rationale lives on the
  F2 parent (dea:information-system-function-resource-and-capacity-management).
inputs:
- input_id: resource-allocation-request
  name: "Resource allocation request"
  definition: "A request to allocate and provision a resource (compute, storage, integration slot) per the capacity plan."
  source: "Capacity-planning flow."
  required: true
  sensitivity_classification: non-sensitive
- input_id: provisioning-policy
  name: "Provisioning policy"
  definition: "The provisioning policy (region, image, identity, network policy)."
  source: "Policy store."
  required: true
  sensitivity_classification: non-sensitive
outputs:
- output_id: provisioned-resource
  name: "Provisioned resource"
  definition: "A provisioned-resource record (target, version, identity, evidence)."
  destination: "Resource store, audit log."
  output_conditions: "Always produced (or an error response)."
execution_characteristics:
  execution_pattern: synchronous
  trigger_mechanism: api-call
  processing_mode: real-time
  synchronous_asynchronous: synchronous
  idempotency: idempotent
  transactional: true
  concurrency: multi-threaded
business_alignment:
  realized_capabilities:
    - capabilities:capability-technology-enablement-y6nkws
  enabled_processes:
    - dea:process-operate-technology-platforms
executing_components:
