id: dea:information-system-function-identity-and-access-management-iam-platform-identity-access-services-issue-and-validate-access-tokens
type: InformationSystemFunction
name: Issue and validate access tokens
description: |
  Executes the 'Issue and validate access tokens' function within the Identity & Access Services
  sub-system of a Identity and Access Management (IAM) Platform. Operating through the Lifecycle
  Service and the MFA Component, it processes information, applies the business logic and rules
  defined for Identity & Access Services, and contributes to trusted authentication,
  authorization and identity lifecycle control. Vendor-neutral record: vendor corroboration (3
  distinct vendor systems) is recorded in governance.source_and_evidence; no vendor product is
  canonical (per G-12).
