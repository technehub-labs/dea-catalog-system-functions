id: dea:information-system-function-authentication
type: InformationSystemFunction
name: "Authentication"
description: |
  The atomic function that authenticates a principal: verifies the presented credentials against the stored credential, applies the authentication policy (MFA, step-up), and produces an authentication result.
version: "1.0.0"
lifecycle_status: planned
functional_domain: isf:domain:identity-and-access
category: isf:domain:identity-and-access
decomposition_level: F4
parent_function: dea:information-system-function-identity-and-access-management
decomposition_rationale: |
  Not applicable to this function. F4 is a leaf; the rationale lives on the
  F2 parent (dea:information-system-function-identity-and-access-management).
inputs:
- input_id: principal-identifier
  name: "Principal identifier"
  definition: "The identifier the principal presents (username, email, biometric template)."
  source: "Caller (via the authentication flow)."
  required: true
  sensitivity_classification: sensitive
- input_id: credential
  name: "Credential"
  definition: "The credential the principal presents (password hash, OTP, biometric signature)."
  source: "Caller."
  required: true
  sensitivity_classification: sensitive
- input_id: authentication-policy
  name: "Authentication policy"
  definition: "The rules that determine the required authentication factors (single-factor, MFA, step-up)."
  source: "Policy store."
  required: true
  sensitivity_classification: non-sensitive
outputs:
- output_id: authentication-result
  name: "Authentication result"
  definition: "The authentication decision (authenticated, not-authenticated, requires-step-up) with the evidence."
  destination: "Caller, audit log."
  output_conditions: "Always produced."
execution_characteristics:
  execution_pattern: synchronous
  trigger_mechanism: api-call
  processing_mode: real-time
  synchronous_asynchronous: synchronous
  idempotency: idempotent
  transactional: false
  concurrency: multi-threaded
business_alignment:
  realized_capabilities:
    - dea:business-capability-identity-assurance
    - dea:business-capability-access-control
  enabled_processes:
    - dea:business-process-onboarding-authenticated-individual
executing_components:
  - dea:information-system-component-identity-broker
non_functional_characteristics:
  criticality: mission-critical
governance:
  functional_owner: "Architecture team"
  steward: "Architecture team"
  approval_status: proposed
  criticality: mission-critical
  review_date: "2027-10-18"
references:
  - technehub-labs/dea-metamodel/change-requests/CR-018-information-system-function.md
metadata:
  created_by: Emmanuel A. Otchere
  created_date: "2026-10-18"
  last_modified: "2026-10-18"
  cr: CR-IS-CAT-01C
  notes: |
