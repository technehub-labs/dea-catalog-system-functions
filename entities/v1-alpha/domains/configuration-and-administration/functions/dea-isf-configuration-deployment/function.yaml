id: dea:information-system-function-configuration-deployment
type: InformationSystemFunction
name: Configuration Deployment
description: 'The atomic function that applies a configuration change to a target (system, service, environment) under a verified approval and emits the configuration-applied event.

  '
version: 1.0.0
lifecycle_status: planned
functional_domain: isf:domain:configuration-and-administration
category: isf:domain:configuration-and-administration
decomposition_level: F4
parent_function: dea:information-system-function-configuration-and-administration
decomposition_rationale: 'Not applicable to this function. F4 is a leaf; the rationale lives on the

  F2 parent (dea:information-system-function-configuration-and-administration).

  '
inputs:
- input_id: configuration-change
  name: Configuration change
  definition: A configuration change record (diff, target, approval).
  source: Change management.
  required: true
  sensitivity_classification: non-sensitive
- input_id: approval-evidence
  name: Approval evidence
  definition: The approval evidence (approver, timestamp, evidence link).
  source: Approval store.
  required: true
  sensitivity_classification: non-sensitive
outputs:
- output_id: deployment-record
  name: Deployment record
  definition: A deployment record (target, version, evidence).
  destination: Deployment store, audit log.
  output_conditions: Always produced (or an error response).
