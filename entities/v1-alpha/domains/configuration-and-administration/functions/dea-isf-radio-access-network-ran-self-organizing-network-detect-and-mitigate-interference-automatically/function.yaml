id: dea:information-system-function-radio-access-network-ran-self-organizing-network-detect-and-mitigate-interference-automatically
type: InformationSystemFunction
name: Detect and mitigate interference automatically
description: |
  Executes the 'Detect and mitigate interference automatically' function within the Self-
  Organizing Network sub-system of a Radio Access Network (RAN). Operating through the
  Interference Mitigation Service and the SON Engine Component, it processes information,
  applies the business logic and rules defined for Self-Organizing Network, and contributes to
  revenue-accurate service delivery over a high-availability network. Vendor-neutral record:
  vendor corroboration (3 distinct vendor systems) is recorded in
  governance.source_and_evidence; no vendor product is canonical (per G-12).
