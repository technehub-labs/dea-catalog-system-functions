id: dea:information-system-function-mobile-core-network-epc-5gc-policy-control-deliver-policy-decisions-to-network-elements
type: InformationSystemFunction
name: Deliver policy decisions to network elements
description: |
  Executes the 'Deliver policy decisions to network elements' function within the Policy Control
  sub-system of a Mobile Core Network (EPC/5GC). Operating through the QoS Enforcement Service
  and the Policy Engine Component, it processes information, applies the business logic and
  rules defined for Policy Control, and contributes to revenue-accurate service delivery over a
  high-availability network. Vendor-neutral record: vendor corroboration (3 distinct vendor
  systems) is recorded in governance.source_and_evidence; no vendor product is canonical (per
  G-12).
