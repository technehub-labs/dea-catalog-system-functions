id: dea:information-system-function-configuration-validation
type: InformationSystemFunction
name: "Configuration Validation"
description: |
  The atomic function that validates a configuration change against the policy and invariant rules before deployment and produces a validation result.
version: "1.0.0"
lifecycle_status: planned
functional_domain: isf:domain:configuration-and-administration
category: isf:domain:configuration-and-administration
decomposition_level: F4
parent_function: dea:information-system-function-configuration-and-administration
decomposition_rationale: |
  Not applicable to this function. F4 is a leaf; the rationale lives on the
  F2 parent (dea:information-system-function-configuration-and-administration).
inputs:
- input_id: configuration-candidate
  name: "Configuration candidate"
  definition: "A candidate configuration under validation."
  source: "Configuration store."
  required: true
  sensitivity_classification: non-sensitive
- input_id: validation-rules
  name: "Validation rules"
  definition: "The validation rules (policy, invariants, schemas)."
  source: "Policy store."
  required: true
  sensitivity_classification: non-sensitive
outputs:
- output_id: validation-decision
  name: "Validation decision"
  definition: "A validation decision (pass, fail, with reasons)."
  destination: "Validation store."
  output_conditions: "Always produced (or an error response)."
execution_characteristics:
  execution_pattern: synchronous
  trigger_mechanism: api-call
  processing_mode: real-time
  synchronous_asynchronous: synchronous
  idempotency: idempotent
  transactional: true
  concurrency: multi-threaded
