id: dea:information-system-function-infrastructure-as-code-iac-platform-infrastructure-as-code-plan-infrastructure-changes-for-review
type: InformationSystemFunction
name: Plan infrastructure changes for review
description: |
  Executes the 'Plan infrastructure changes for review' function within the Infrastructure as
  Code sub-system of a Infrastructure as Code (IaC) Platform. Operating through the Plan Service
  and the Plan Component, it processes information, applies the business logic and rules defined
  for Infrastructure as Code, and contributes to reliable, repeatable and observable delivery of
  software and infrastructure. Vendor-neutral record: vendor corroboration (3 distinct vendor
  systems) is recorded in governance.source_and_evidence; no vendor product is canonical (per
  G-12).
