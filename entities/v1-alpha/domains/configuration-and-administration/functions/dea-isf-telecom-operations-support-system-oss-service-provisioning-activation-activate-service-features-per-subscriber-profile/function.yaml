id: dea:information-system-function-telecom-operations-support-system-oss-service-provisioning-activation-activate-service-features-per-subscriber-profile
type: InformationSystemFunction
name: Activate service features per subscriber profile
description: |
  Executes the 'Activate service features per subscriber profile' function within the Service
  Provisioning & Activation sub-system of a Telecom Operations Support System (OSS). Operating
  through the Configuration Service and the Activation Engine Component, it processes
  information, applies the business logic and rules defined for Service Provisioning &
  Activation, and contributes to revenue-accurate service delivery over a high-availability
  network. Vendor-neutral record: vendor corroboration (3 distinct vendor systems) is recorded
  in governance.source_and_evidence; no vendor product is canonical (per G-12).
