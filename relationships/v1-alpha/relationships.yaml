# Cross-catalogue relationships :  Information System Function
# CR-IS-CAT-01D (2026-10-18). The cross-catalogue relationship registry.
# Each relationship record references a source function and a target entity in
# another catalogue (business capabilities, business processes, components,
# services, integration interfaces, data entities, events, metrics).
# The relationship type is cross-referenced to the metamodel's relationship
# vocabulary (dea:realizes, dea:enables, dea:executes, dea:provides, dea:exposes,
# dea:specifies, dea:consumes, dea:produces, dea:measuredBy [OpenDEAM allocation]).
#
# Governance:
# - G-08: every relationship uses an authorized semantic contract.
# - G-11: metric definitions remain owned by the Metric catalogue; the
#   measured_by row is an OpenDEAM allocation declaration, not a metamodel
#   relationship claim.

version: 1
cr: CR-IS-CAT-01D
